<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drachenhandel 🐉</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=MedievalSharp&family=Cinzel:wght@400;700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap');

  :root {
    --gold: #f5c842;
    --dark-gold: #b8860b;
    --parchment: #f2e8c9;
    --parchment-dark: #ddd0a0;
    --brown: #4a2c0a;
    --brown-light: #7a4a1a;
    --red: #8b1a1a;
    --green: #1a5c1a;
    --blue: #1a2a6c;
    --purple: #4a1a6c;
    --shadow: rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1a0a00;
    background-image:
      radial-gradient(ellipse at 20% 20%, #2a1000 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, #001020 0%, transparent 50%);
    font-family: 'Crimson Text', serif;
    min-height: 100vh;
    color: var(--brown);
    overflow-x: hidden;
  }

  /* Stars background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 15%, rgba(255,255,200,0.8) 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 40%, rgba(255,255,200,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 50% 10%, rgba(255,255,200,0.9) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 60%, rgba(255,255,200,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 85% 25%, rgba(255,255,200,0.7) 0%, transparent 100%),
      radial-gradient(1px 1px at 20% 70%, rgba(255,255,200,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 85%, rgba(255,255,200,0.8) 0%, transparent 100%),
      radial-gradient(2px 2px at 40% 55%, rgba(255,220,100,0.9) 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 45%, rgba(255,255,200,0.7) 0%, transparent 100%),
      radial-gradient(1px 1px at 15% 90%, rgba(255,255,200,0.5) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  #app {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 10px;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 20px 10px 15px;
  }
  .header h1 {
    font-family: 'Cinzel', serif;
    font-size: clamp(2rem, 6vw, 3.5rem);
    font-weight: 900;
    color: var(--gold);
    text-shadow: 0 0 20px rgba(245,200,66,0.5), 2px 2px 0 var(--brown);
    letter-spacing: 3px;
  }
  .header .subtitle {
    font-family: 'Crimson Text', serif;
    font-style: italic;
    color: var(--parchment-dark);
    font-size: 1.1rem;
    margin-top: 4px;
  }

  /* Status Bar */
  .status-bar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 12px;
  }
  .stat-badge {
    background: linear-gradient(135deg, #2a1800, #1a0e00);
    border: 2px solid var(--dark-gold);
    border-radius: 8px;
    padding: 6px 14px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'Cinzel', serif;
    font-size: 0.85rem;
    color: var(--gold);
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  .stat-badge .icon { font-size: 1.1rem; }
  .stat-badge .value { font-weight: 700; font-size: 1rem; }

  /* Main Panel */
  .panel {
    background: linear-gradient(160deg, var(--parchment) 0%, var(--parchment-dark) 100%);
    border: 3px solid var(--dark-gold);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.3);
    position: relative;
    overflow: hidden;
  }
  .panel::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23b8860b' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    pointer-events: none;
    opacity: 0.5;
  }

  .panel-title {
    font-family: 'Cinzel', serif;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--brown);
    border-bottom: 2px solid var(--dark-gold);
    padding-bottom: 8px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* City Map */
  .city-map {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .city-btn {
    background: linear-gradient(135deg, #2a1800, #3a2010);
    border: 2px solid var(--dark-gold);
    border-radius: 10px;
    padding: 10px 8px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    font-family: 'Cinzel', serif;
    color: var(--gold);
    font-size: 0.8rem;
    position: relative;
  }
  .city-btn:hover:not(:disabled) {
    background: linear-gradient(135deg, #3a2800, #5a3820);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(245,200,66,0.3);
  }
  .city-btn.current {
    border-color: #f5c842;
    background: linear-gradient(135deg, #4a2800, #6a3820);
    box-shadow: 0 0 12px rgba(245,200,66,0.4);
  }
  .city-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .city-icon { font-size: 1.8rem; display: block; margin-bottom: 4px; }
  .city-name { font-weight: 700; font-size: 0.85rem; }
  .city-tag { font-size: 0.65rem; color: var(--parchment-dark); font-family: 'Crimson Text', serif; margin-top: 2px; }
  .travel-cost { font-size: 0.7rem; color: var(--gold); opacity: 0.8; margin-top: 3px; }

  /* Market */
  .goods-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  .good-card {
    background: rgba(255,255,255,0.3);
    border: 1.5px solid var(--dark-gold);
    border-radius: 8px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .good-header {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .good-icon { font-size: 1.6rem; }
  .good-name { font-family: 'Cinzel', serif; font-size: 0.8rem; font-weight: 700; color: var(--brown); }
  .good-price {
    font-size: 0.85rem;
    color: var(--dark-gold);
    font-weight: 600;
  }
  .good-actions { display: flex; gap: 6px; align-items: center; }
  .btn-trade {
    flex: 1;
    padding: 5px 4px;
    border: none;
    border-radius: 6px;
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-buy {
    background: linear-gradient(135deg, var(--green), #2a7a2a);
    color: #fff;
    border: 1.5px solid #1a4a1a;
  }
  .btn-sell {
    background: linear-gradient(135deg, var(--red), #aa2a2a);
    color: #fff;
    border: 1.5px solid #4a1a1a;
  }
  .btn-trade:hover:not(:disabled) { transform: scale(1.05); filter: brightness(1.15); }
  .btn-trade:disabled { opacity: 0.4; cursor: not-allowed; }
  .in-bag { font-size: 0.7rem; color: var(--brown-light); font-style: italic; }

  /* Inventory */
  .inventory-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    min-height: 60px;
  }
  .inv-item {
    background: rgba(255,255,255,0.25);
    border: 1.5px solid var(--dark-gold);
    border-radius: 7px;
    padding: 8px 6px;
    text-align: center;
    font-size: 0.75rem;
    color: var(--brown);
  }
  .inv-item .inv-icon { font-size: 1.3rem; }
  .inv-empty { color: var(--brown-light); font-style: italic; font-size: 0.8rem; grid-column: 1/-1; text-align: center; padding: 10px; }

  /* Log */
  .log {
    max-height: 100px;
    overflow-y: auto;
    font-size: 0.8rem;
    color: var(--brown);
    font-style: italic;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .log-entry { padding: 2px 0; border-bottom: 1px solid rgba(180,140,0,0.2); }
  .log-entry.good { color: var(--green); }
  .log-entry.bad { color: var(--red); }

  /* Bag indicator */
  .bag-bar {
    height: 8px;
    background: rgba(0,0,0,0.15);
    border-radius: 4px;
    overflow: hidden;
    margin-top: 6px;
  }
  .bag-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--green), var(--dark-gold));
    border-radius: 4px;
    transition: width 0.3s;
  }
  .bag-fill.full { background: linear-gradient(90deg, var(--red), #cc4400); }

  /* Turns display */
  .turns-left {
    display: flex;
    gap: 4px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 4px;
  }
  .turn-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--dark-gold);
    box-shadow: 0 0 4px rgba(245,200,66,0.5);
  }
  .turn-dot.used { background: #444; box-shadow: none; }

  /* Win/Lose overlay */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .overlay.show { display: flex; }
  .overlay-box {
    background: linear-gradient(160deg, var(--parchment), var(--parchment-dark));
    border: 4px solid var(--dark-gold);
    border-radius: 16px;
    padding: 30px 24px;
    text-align: center;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 8px 40px rgba(0,0,0,0.7);
  }
  .overlay-icon { font-size: 4rem; margin-bottom: 10px; }
  .overlay-title {
    font-family: 'Cinzel', serif;
    font-size: 1.8rem;
    font-weight: 900;
    color: var(--brown);
    margin-bottom: 8px;
  }
  .overlay-msg { font-size: 1rem; color: var(--brown-light); margin-bottom: 20px; line-height: 1.5; }
  .btn-restart {
    background: linear-gradient(135deg, var(--dark-gold), #e0a020);
    border: none;
    border-radius: 10px;
    padding: 12px 30px;
    font-family: 'Cinzel', serif;
    font-size: 1rem;
    font-weight: 700;
    color: var(--brown);
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 3px 10px rgba(0,0,0,0.3);
  }
  .btn-restart:hover { transform: scale(1.05); filter: brightness(1.1); }

  /* Tooltip */
  .tooltip { position: relative; }
  .tooltip:hover::after {
    content: attr(data-tip);
    position: absolute;
    bottom: 110%;
    left: 50%;
    transform: translateX(-50%);
    background: #1a0a00;
    color: var(--gold);
    font-size: 0.7rem;
    padding: 4px 8px;
    border-radius: 6px;
    white-space: nowrap;
    border: 1px solid var(--dark-gold);
    z-index: 10;
    pointer-events: none;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 3px; }
  ::-webkit-scrollbar-thumb { background: var(--dark-gold); border-radius: 3px; }

  /* Name Input */
  .name-input-wrap {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .name-input {
    flex: 1;
    min-width: 160px;
    padding: 8px 14px;
    border: 2px solid var(--dark-gold);
    border-radius: 8px;
    background: rgba(255,255,255,0.85);
    font-family: 'Cinzel', serif;
    font-size: 0.95rem;
    color: var(--brown);
    outline: none;
  }
  .name-input:focus { border-color: var(--gold); box-shadow: 0 0 8px rgba(245,200,66,0.4); }
  .btn-save-score {
    background: linear-gradient(135deg, var(--dark-gold), #e0a020);
    border: none;
    border-radius: 8px;
    padding: 8px 18px;
    font-family: 'Cinzel', serif;
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--brown);
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .btn-save-score:hover { transform: scale(1.05); filter: brightness(1.1); }
  .btn-save-score:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* Highscore Table */
  .hs-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }
  .hs-table th {
    font-family: 'Cinzel', serif;
    font-size: 0.75rem;
    color: var(--brown-light);
    text-align: left;
    padding: 4px 8px;
    border-bottom: 1px solid var(--dark-gold);
  }
  .hs-table td {
    padding: 6px 8px;
    border-bottom: 1px solid rgba(184,134,11,0.2);
    color: var(--brown);
  }
  .hs-table tr.hs-top td { font-weight: 700; color: var(--brown); }
  .hs-table tr.hs-top:first-child td { color: #8b4500; }
  .hs-rank { font-family: 'Cinzel', serif; font-weight: 700; width: 30px; }
  .hs-medal { font-size: 1.1rem; }
  .hs-gold-val { font-family: 'Cinzel', serif; font-weight: 700; color: var(--dark-gold); }
  .hs-empty { text-align: center; font-style: italic; color: var(--brown-light); padding: 16px; }
  .hs-new { background: rgba(245,200,66,0.2); animation: hs-flash 1s ease; }
  @keyframes hs-flash {
    0%   { background: rgba(245,200,66,0.5); }
    100% { background: rgba(245,200,66,0.15); }
  }
  .btn-clear-hs {
    background: none;
    border: 1px solid rgba(139,26,26,0.4);
    border-radius: 6px;
    padding: 3px 10px;
    font-size: 0.7rem;
    color: var(--red);
    cursor: pointer;
    font-family: 'Crimson Text', serif;
    margin-left: auto;
    transition: all 0.15s;
  }
  .btn-clear-hs:hover { background: rgba(139,26,26,0.1); }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>🐉 Drachenhandel</h1>
    <div class="subtitle">Reise durch die magischen Lande — kaufe günstig, verkaufe teuer!</div>
  </div>

  <div class="status-bar" id="statusBar">
    <!-- rendered by JS -->
  </div>

  <div class="panel">
    <div class="panel-title">🗺️ Karte der Zauberlande <span style="font-size:0.8rem; font-weight:400; color:var(--brown-light); margin-left:auto;">Runden übrig:</span></div>
    <div class="turns-left" id="turnsLeft"></div>
    <div style="height:10px"></div>
    <div class="city-map" id="cityMap"></div>
  </div>

  <div class="panel">
    <div class="panel-title" id="marketTitle">🏪 Markt</div>
    <div class="goods-grid" id="marketGoods"></div>
  </div>

  <div class="panel">
    <div class="panel-title">🎒 Dein Rucksack
      <span id="bagCount" style="font-size:0.8rem; font-weight:400; color:var(--brown-light); margin-left:auto;"></span>
    </div>
    <div class="bag-bar"><div class="bag-fill" id="bagFill"></div></div>
    <div style="height:8px"></div>
    <div class="inventory-grid" id="inventory"></div>
  </div>

  <div class="panel">
    <div class="panel-title">📜 Reisetagebuch</div>
    <div class="log" id="log"></div>
  </div>

  <div class="panel">
    <div class="panel-title">🏆 Bestenliste <button class="btn-clear-hs" onclick="clearHighscores()">🗑️ Löschen</button></div>
    <div id="highscoreList"></div>
  </div>
</div>

<!-- Win/Lose overlay -->
<div class="overlay" id="overlay">
  <div class="overlay-box">
    <div class="overlay-icon" id="overlayIcon"></div>
    <div class="overlay-title" id="overlayTitle"></div>
    <div class="overlay-msg" id="overlayMsg"></div>
    <div class="name-input-wrap" id="nameInputWrap">
      <input class="name-input" id="playerNameInput" type="text" maxlength="20" placeholder="Dein Name..." />
      <button class="btn-save-score" id="btnSaveScore" onclick="saveScore()">💾 Eintragen</button>
    </div>
    <button class="btn-restart" onclick="initGame()">🔄 Nochmal spielen!</button>
  </div>
</div>

<script>
// ---- GAME DATA ----
const CITIES = [
  { id: 'drachenfels', name: 'Drachenfels', icon: '🏔️', tag: 'Drachenhort', special: 'drachenstaub', travelCost: 0 },
  { id: 'elfenwald',   name: 'Elfenwald',   icon: '🌲', tag: 'Elfensiedlung', special: 'elfenpulver', travelCost: 10 },
  { id: 'kristallsee', name: 'Kristallsee', icon: '💧', tag: 'Wasserreich',   special: 'zauberkristall', travelCost: 15 },
  { id: 'feuerberg',   name: 'Feuerberg',   icon: '🌋', tag: 'Zwergenstadt',  special: 'feuergold', travelCost: 20 },
  { id: 'mondturm',    name: 'Mondturm',    icon: '🌙', tag: 'Zauberburg',    special: 'mondstein', travelCost: 25 },
  { id: 'sturmklippe', name: 'Sturmklippe', icon: '⚡', tag: 'Hexendorf',     special: 'blitzkraut', travelCost: 30 },
];

const GOODS = [
  { id: 'drachenstaub',   name: 'Drachenstaub',   icon: '✨', basePrice: 30, desc: 'Funkelnder Staub von Drachen' },
  { id: 'elfenpulver',    name: 'Elfenpulver',     icon: '🌟', basePrice: 40, desc: 'Glitzerndes Elfenstaub' },
  { id: 'zauberkristall', name: 'Zauberkristall',  icon: '💎', basePrice: 55, desc: 'Leuchtender Kristall' },
  { id: 'feuergold',      name: 'Feuergold',       icon: '🔥', basePrice: 70, desc: 'Gold aus dem Vulkan' },
  { id: 'mondstein',      name: 'Mondstein',       icon: '🌕', basePrice: 60, desc: 'Magischer Mondstein' },
  { id: 'blitzkraut',     name: 'Blitzkraut',      icon: '⚡', basePrice: 35, desc: 'Elektrisches Zauberkraut' },
  { id: 'heiltrank',      name: 'Heiltrank',       icon: '🧪', basePrice: 45, desc: 'Heilende Zaubertrank' },
  { id: 'drachenschuppe', name: 'Drachenschuppe',  icon: '🛡️', basePrice: 80, desc: 'Seltene Drachenschuppe' },
];

const BAG_SIZE = 6;
const START_GOLD = 200;
const TOTAL_TURNS = 12;
const WIN_GOLD = 500;

// ---- GAME STATE ----
let state = {};

function initGame() {
  document.getElementById('overlay').classList.remove('show');
  // generate prices per city
  const cityPrices = {};
  CITIES.forEach(city => {
    cityPrices[city.id] = {};
    GOODS.forEach(good => {
      // cities specialising in a good sell it cheap, buy it pricier elsewhere
      const isSpecial = city.special === good.id;
      const factor = isSpecial
        ? 0.55 + Math.random() * 0.2      // 55–75% of base (cheap here)
        : 1.0  + Math.random() * 0.6;     // 100–160% of base (expensive)
      cityPrices[city.id][good.id] = Math.round(good.basePrice * factor);
    });
  });

  state = {
    gold: START_GOLD,
    turnsLeft: TOTAL_TURNS,
    currentCity: 'drachenfels',
    bag: [],          // [{id, name, icon, buyPrice}]
    cityPrices,
    log: ['🐉 Willkommen, tapferer Händler! Reise durch die Zauberlande und mache Gewinn!'],
  };
  render();
}

// ---- HELPERS ----
function getPrice(cityId, goodId) {
  return state.cityPrices[cityId][goodId];
}

function bagCount() { return state.bag.length; }
function bagFull()  { return state.bag.length >= BAG_SIZE; }

function addLog(msg, type='') {
  state.log.unshift({ msg, type });
  if (state.log.length > 30) state.log.pop();
}

function travel(cityId) {
  const city = CITIES.find(c => c.id === cityId);
  if (!city || cityId === state.currentCity) return;
  if (city.travelCost > state.gold) {
    addLog(`⚠️ Nicht genug Gold für die Reise nach ${city.name}!`, 'bad');
    render();
    return;
  }
  state.gold -= city.travelCost;
  state.currentCity = cityId;
  state.turnsLeft--;
  // Randomize prices slightly each visit
  GOODS.forEach(good => {
    const cur = state.cityPrices[cityId][good.id];
    const delta = Math.floor((Math.random() - 0.5) * 10);
    state.cityPrices[cityId][good.id] = Math.max(5, cur + delta);
  });
  if (city.travelCost > 0) addLog(`🗺️ Reise nach ${city.name} kostet ${city.travelCost} 🪙`, 'bad');
  else addLog(`🏠 Du bist in ${city.name}.`);
  checkEnd();
  render();
}

function buy(goodId) {
  if (bagFull()) { addLog('🎒 Dein Rucksack ist voll!', 'bad'); render(); return; }
  const price = getPrice(state.currentCity, goodId);
  if (price > state.gold) { addLog('💸 Nicht genug Gold!', 'bad'); render(); return; }
  const good = GOODS.find(g => g.id === goodId);
  state.gold -= price;
  state.bag.push({ id: goodId, name: good.name, icon: good.icon, buyPrice: price });
  addLog(`✅ ${good.icon} ${good.name} für ${price} 🪙 gekauft`, 'good');
  render();
}

function sell(goodId) {
  const idx = state.bag.findIndex(b => b.id === goodId);
  if (idx === -1) return;
  const item = state.bag[idx];
  const price = getPrice(state.currentCity, goodId);
  state.bag.splice(idx, 1);
  const profit = price - item.buyPrice;
  state.gold += price;
  if (profit > 0) addLog(`💰 ${item.icon} ${item.name} für ${price} 🪙 verkauft (+${profit} Gewinn!)`, 'good');
  else if (profit === 0) addLog(`➡️ ${item.icon} ${item.name} für ${price} 🪙 verkauft (kein Gewinn)`, '');
  else addLog(`📉 ${item.icon} ${item.name} für ${price} 🪙 verkauft (${profit} Verlust)`, 'bad');
  render();
}

function checkEnd() {
  if (state.turnsLeft <= 0) {
    setTimeout(() => showEnd(), 300);
  }
}

// ---- HIGHSCORE ----
const HS_KEY = 'drachenhandel_hs';
const MAX_HS = 10;

function loadHighscores() {
  try { return JSON.parse(localStorage.getItem(HS_KEY) || '[]'); } catch(e) { return []; }
}
function saveHighscores(list) {
  localStorage.setItem(HS_KEY, JSON.stringify(list));
}
function clearHighscores() {
  if (confirm('Wirklich alle Einträge löschen?')) {
    localStorage.removeItem(HS_KEY);
    renderHighscores();
  }
}
function saveScore() {
  const nameEl = document.getElementById('playerNameInput');
  const name = nameEl.value.trim() || 'Unbekannter Held';
  const list = loadHighscores();
  const date = new Date().toLocaleDateString('de-DE');
  list.push({ name, gold: state._finalGold, won: state._won, date });
  list.sort((a, b) => b.gold - a.gold);
  if (list.length > MAX_HS) list.length = MAX_HS;
  saveHighscores(list);
  // Disable save button
  document.getElementById('btnSaveScore').disabled = true;
  document.getElementById('btnSaveScore').textContent = '✅ Gespeichert!';
  nameEl.disabled = true;
  renderHighscores(name);
}

function renderHighscores(highlightName) {
  const list = loadHighscores();
  const el = document.getElementById('highscoreList');
  if (!list.length) {
    el.innerHTML = '<div class="hs-empty">Noch keine Einträge — spiel und trag dich ein! 🐉</div>';
    return;
  }
  const medals = ['🥇','🥈','🥉'];
  const rows = list.map((e, i) => {
    const isNew = highlightName && e.name === highlightName && i === list.findIndex(x => x.name === highlightName && x.gold === e.gold);
    return `<tr class="${i < 3 ? 'hs-top' : ''} ${isNew ? 'hs-new' : ''}">
      <td class="hs-rank">${medals[i] || (i+1)+'.'}</td>
      <td>${e.name}</td>
      <td class="hs-gold-val">${e.gold} 🪙</td>
      <td>${e.won ? '🏆' : '😔'}</td>
      <td style="font-size:0.72rem; color:var(--brown-light);">${e.date}</td>
    </tr>`;
  }).join('');
  el.innerHTML = `<table class="hs-table">
    <thead><tr>
      <th>#</th><th>Name</th><th>Gold</th><th>Ergebnis</th><th>Datum</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function showEnd() {
  const overlay = document.getElementById('overlay');
  const icon = document.getElementById('overlayIcon');
  const title = document.getElementById('overlayTitle');
  const msg = document.getElementById('overlayMsg');

  // Sell all remaining items at current city
  let finalGold = state.gold;
  state.bag.forEach(item => {
    finalGold += getPrice(state.currentCity, item.id);
  });
  state._finalGold = finalGold;

  const won = finalGold >= WIN_GOLD;
  state._won = won;

  // Reset name input
  const nameEl = document.getElementById('playerNameInput');
  nameEl.value = '';
  nameEl.disabled = false;
  const saveBtn = document.getElementById('btnSaveScore');
  saveBtn.disabled = false;
  saveBtn.textContent = '💾 Eintragen';

  overlay.classList.add('show');

  if (won) {
    icon.textContent = '🏆';
    title.textContent = 'Gewonnen!';
    msg.innerHTML = `Du hast <strong>${finalGold} 🪙</strong> verdient!<br><br>Der König ernennt dich zum <em>Meister-Drachenhändler</em>! 🐉<br><span style="font-size:0.85rem; color:var(--brown-light);">Trag deinen Namen ein!</span>`;
  } else {
    icon.textContent = '😔';
    title.textContent = 'Schade!';
    msg.innerHTML = `Du hast <strong>${finalGold} 🪙</strong> verdient.<br>Ziel war: ${WIN_GOLD} 🪙<br><br><span style="font-size:0.85rem; color:var(--brown-light);">Trag deinen Score ein und versuche es nochmal!</span>`;
  }
}

// ---- RENDER ----
function render() {
  renderStatus();
  renderTurns();
  renderCityMap();
  renderMarket();
  renderInventory();
  renderLog();
  renderHighscores();
}

function renderStatus() {
  document.getElementById('statusBar').innerHTML = `
    <div class="stat-badge"><span class="icon">🪙</span><span>Gold:</span><span class="value">${state.gold}</span></div>
    <div class="stat-badge"><span class="icon">🎒</span><span>Rucksack:</span><span class="value">${bagCount()}/${BAG_SIZE}</span></div>
    <div class="stat-badge"><span class="icon">⏳</span><span>Runden:</span><span class="value">${state.turnsLeft}</span></div>
    <div class="stat-badge"><span class="icon">🏆</span><span>Ziel:</span><span class="value">${WIN_GOLD} 🪙</span></div>
  `;
}

function renderTurns() {
  const used = TOTAL_TURNS - state.turnsLeft;
  let html = '';
  for (let i = 0; i < TOTAL_TURNS; i++) {
    html += `<div class="turn-dot ${i < used ? 'used' : ''}"></div>`;
  }
  document.getElementById('turnsLeft').innerHTML = html;
}

function renderCityMap() {
  const cur = CITIES.find(c => c.id === state.currentCity);
  document.getElementById('cityMap').innerHTML = CITIES.map(city => {
    const isCurrent = city.id === state.currentCity;
    const canAfford = city.travelCost <= state.gold;
    const costLabel = city.travelCost === 0 ? 'Start-Stadt' : `Reise: ${city.travelCost} 🪙`;
    return `
      <button
        class="city-btn ${isCurrent ? 'current' : ''} tooltip"
        data-tip="${isCurrent ? 'Du bist hier!' : (canAfford ? 'Reise hierher' : 'Zu weit weg!')}"
        onclick="travel('${city.id}')"
        ${isCurrent || !canAfford ? 'disabled' : ''}
      >
        <span class="city-icon">${city.icon}</span>
        <span class="city-name">${city.name}</span>
        <span class="city-tag">${city.tag}</span>
        ${!isCurrent ? `<span class="travel-cost">${costLabel}</span>` : '<span class="travel-cost">📍 Hier</span>'}
      </button>
    `;
  }).join('');
}

function renderMarket() {
  const city = CITIES.find(c => c.id === state.currentCity);
  document.getElementById('marketTitle').innerHTML = `🏪 Markt in ${city.icon} ${city.name}`;
  const inBag = {};
  state.bag.forEach(b => { inBag[b.id] = (inBag[b.id] || 0) + 1; });

  document.getElementById('marketGoods').innerHTML = GOODS.map(good => {
    const price = getPrice(state.currentCity, good.id);
    const owned = inBag[good.id] || 0;
    const isSpecial = city.special === good.id;
    const priceColor = isSpecial ? 'color: var(--green); font-weight:700;' : '';
    return `
      <div class="good-card">
        <div class="good-header">
          <span class="good-icon">${good.icon}</span>
          <div>
            <div class="good-name">${good.name}${isSpecial ? ' ⭐' : ''}</div>
            <div class="good-price" style="${priceColor}">${price} 🪙</div>
          </div>
        </div>
        <div class="good-actions">
          <button class="btn-trade btn-buy" onclick="buy('${good.id}')"
            ${bagFull() || price > state.gold ? 'disabled' : ''}>
            Kaufen
          </button>
          <button class="btn-trade btn-sell" onclick="sell('${good.id}')"
            ${owned === 0 ? 'disabled' : ''}>
            Verkaufen
          </button>
        </div>
        ${owned > 0 ? `<div class="in-bag">Im Rucksack: ${owned}x</div>` : ''}
      </div>
    `;
  }).join('');
}

function renderInventory() {
  const fill = document.getElementById('bagFill');
  const pct = (bagCount() / BAG_SIZE) * 100;
  fill.style.width = pct + '%';
  fill.className = 'bag-fill' + (bagFull() ? ' full' : '');
  document.getElementById('bagCount').textContent = `${bagCount()} / ${BAG_SIZE} Plätze`;

  if (bagCount() === 0) {
    document.getElementById('inventory').innerHTML = '<div class="inv-empty">Noch nichts gekauft...</div>';
    return;
  }

  // group by id
  const grouped = {};
  state.bag.forEach(item => {
    if (!grouped[item.id]) grouped[item.id] = { ...item, count: 0, totalBuy: 0 };
    grouped[item.id].count++;
    grouped[item.id].totalBuy += item.buyPrice;
  });

  document.getElementById('inventory').innerHTML = Object.values(grouped).map(g => {
    const curPrice = getPrice(state.currentCity, g.id);
    const avgBuy = Math.round(g.totalBuy / g.count);
    const diff = curPrice - avgBuy;
    const diffStr = diff >= 0 ? `+${diff}` : `${diff}`;
    const diffColor = diff > 0 ? 'var(--green)' : diff < 0 ? 'var(--red)' : 'inherit';
    return `
      <div class="inv-item">
        <div class="inv-icon">${g.icon}</div>
        <div>${g.name}</div>
        <div style="font-weight:600;">${g.count}x</div>
        <div style="font-size:0.65rem; color:${diffColor};">${diffStr} 🪙</div>
      </div>
    `;
  }).join('');
}

function renderLog() {
  document.getElementById('log').innerHTML = state.log.map(entry => {
    if (typeof entry === 'string') return `<div class="log-entry">${entry}</div>`;
    return `<div class="log-entry ${entry.type || ''}">${entry.msg}</div>`;
  }).join('');
}

// Start!
initGame();
</script>
</body>
</html>
