<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drachenhandel 🐉</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Cinzel:wght@400;700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap');

  :root {
    --gold: #f5c842;
    --dark-gold: #b8860b;
    --parchment: #f2e8c9;
    --parchment-dark: #ddd0a0;
    --brown: #4a2c0a;
    --brown-light: #7a4a1a;
    --red: #8b1a1a;
    --green: #1a5c1a;
    --blue: #1a2a6c;
    --purple: #4a1a6c;
    --shadow: rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1a0a00;
    background-image:
      radial-gradient(ellipse at 20% 20%, #2a1000 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, #001020 0%, transparent 50%);
    font-family: 'Crimson Text', serif;
    min-height: 100vh;
    color: var(--brown);
    overflow-x: hidden;
  }

  /* Stars background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 15%, rgba(255,255,200,0.8) 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 40%, rgba(255,255,200,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 50% 10%, rgba(255,255,200,0.9) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 60%, rgba(255,255,200,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 85% 25%, rgba(255,255,200,0.7) 0%, transparent 100%),
      radial-gradient(1px 1px at 20% 70%, rgba(255,255,200,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 85%, rgba(255,255,200,0.8) 0%, transparent 100%),
      radial-gradient(2px 2px at 40% 55%, rgba(255,220,100,0.9) 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 45%, rgba(255,255,200,0.7) 0%, transparent 100%),
      radial-gradient(1px 1px at 15% 90%, rgba(255,255,200,0.5) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  #app {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 10px;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 20px 10px 15px;
    position: relative;
  }
  .header h1 {
    font-family: 'UnifrakturMaguntia', 'Cinzel', serif;
    font-size: clamp(2.2rem, 7vw, 4rem);
    font-weight: 400;
    color: var(--gold);
    text-shadow: 0 0 20px rgba(245,200,66,0.5), 2px 2px 0 var(--brown);
    letter-spacing: 2px;
  }
  .header .subtitle {
    font-family: 'Crimson Text', serif;
    font-style: italic;
    color: var(--parchment-dark);
    font-size: 1.1rem;
    margin-top: 4px;
  }
  .music-btn {
    position: absolute;
    top: 20px;
    right: 0;
    background: linear-gradient(135deg, #2a1800, #1a0e00);
    border: 2px solid var(--dark-gold);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 1.2rem;
    cursor: pointer;
    color: var(--gold);
    transition: all 0.2s;
  }
  .music-btn:hover { background: linear-gradient(135deg, #3a2800, #2a1800); }

  /* Status Bar */
  .status-bar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 12px;
  }
  .stat-badge {
    background: linear-gradient(135deg, #2a1800, #1a0e00);
    border: 2px solid var(--dark-gold);
    border-radius: 8px;
    padding: 6px 14px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'Cinzel', serif;
    font-size: 0.85rem;
    color: var(--gold);
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  .stat-badge .icon { font-size: 1.1rem; }
  .stat-badge .value { font-weight: 700; font-size: 1rem; }

  /* Main Panel */
  .panel {
    background: linear-gradient(160deg, var(--parchment) 0%, var(--parchment-dark) 100%);
    border: 3px solid var(--dark-gold);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.3);
    position: relative;
    overflow: hidden;
  }
  .panel::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23b8860b' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    pointer-events: none;
    opacity: 0.5;
  }

  .panel-title {
    font-family: 'Cinzel', serif;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--brown);
    border-bottom: 2px solid var(--dark-gold);
    padding-bottom: 8px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* City Map */
  .city-map {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .city-btn {
    background: linear-gradient(135deg, #2a1800, #3a2010);
    border: 2px solid var(--dark-gold);
    border-radius: 10px;
    padding: 10px 8px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    font-family: 'Cinzel', serif;
    color: var(--gold);
    font-size: 0.8rem;
    position: relative;
  }
  .city-btn:hover:not(:disabled) {
    background: linear-gradient(135deg, #3a2800, #5a3820);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(245,200,66,0.3);
  }
  .city-btn.current {
    border-color: #f5c842;
    background: linear-gradient(135deg, #4a2800, #6a3820);
    box-shadow: 0 0 12px rgba(245,200,66,0.4);
  }
  .city-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .city-icon { font-size: 1.8rem; display: block; margin-bottom: 4px; }
  .city-name { font-weight: 700; font-size: 0.85rem; }
  .city-tag { font-size: 0.65rem; color: var(--parchment-dark); font-family: 'Crimson Text', serif; margin-top: 2px; }
  .travel-cost { font-size: 0.7rem; color: var(--gold); opacity: 0.8; margin-top: 3px; }
  .city-rep { font-size: 0.6rem; color: #f5c842; margin-top: 2px; }

  /* Market */
  .goods-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  .good-card {
    background: rgba(255,255,255,0.3);
    border: 1.5px solid var(--dark-gold);
    border-radius: 8px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .good-header {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .good-icon { font-size: 1.6rem; }
  .good-name { font-family: 'Cinzel', serif; font-size: 0.8rem; font-weight: 700; color: var(--brown); }
  .good-price {
    font-size: 0.8rem;
    color: var(--dark-gold);
    font-weight: 600;
  }
  .good-actions { display: flex; gap: 6px; align-items: center; }
  .btn-trade {
    flex: 1;
    padding: 5px 4px;
    border: none;
    border-radius: 6px;
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-buy {
    background: linear-gradient(135deg, var(--green), #2a7a2a);
    color: #fff;
    border: 1.5px solid #1a4a1a;
  }
  .btn-sell {
    background: linear-gradient(135deg, var(--red), #aa2a2a);
    color: #fff;
    border: 1.5px solid #4a1a1a;
  }
  .btn-trade:hover:not(:disabled) { transform: scale(1.05); filter: brightness(1.15); }
  .btn-trade:disabled { opacity: 0.4; cursor: not-allowed; }
  .in-bag { font-size: 0.7rem; color: var(--brown-light); font-style: italic; }

  /* Inventory */
  .inventory-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    min-height: 60px;
  }
  .inv-item {
    background: rgba(255,255,255,0.25);
    border: 1.5px solid var(--dark-gold);
    border-radius: 7px;
    padding: 8px 6px;
    text-align: center;
    font-size: 0.75rem;
    color: var(--brown);
  }
  .inv-item .inv-icon { font-size: 1.3rem; }
  .inv-empty { color: var(--brown-light); font-style: italic; font-size: 0.8rem; grid-column: 1/-1; text-align: center; padding: 10px; }

  /* Log */
  .log {
    max-height: 120px;
    overflow-y: auto;
    font-size: 0.8rem;
    color: var(--brown);
    font-style: italic;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .log-entry { padding: 2px 0; border-bottom: 1px solid rgba(180,140,0,0.2); }
  .log-entry.good { color: var(--green); }
  .log-entry.bad { color: var(--red); }

  /* Bag indicator */
  .bag-bar {
    height: 8px;
    background: rgba(0,0,0,0.15);
    border-radius: 4px;
    overflow: hidden;
    margin-top: 6px;
  }
  .bag-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--green), var(--dark-gold));
    border-radius: 4px;
    transition: width 0.3s;
  }
  .bag-fill.full { background: linear-gradient(90deg, var(--red), #cc4400); }

  /* Turns display */
  .turns-left {
    display: flex;
    gap: 4px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 4px;
  }
  .turn-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--dark-gold);
    box-shadow: 0 0 4px rgba(245,200,66,0.5);
  }
  .turn-dot.used { background: #444; box-shadow: none; }

  /* Event flash banner */
  .event-banner {
    display: none;
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(135deg, #2a1800ee, #1a0e00ee);
    border: 2px solid var(--dark-gold);
    border-radius: 12px;
    padding: 14px 28px;
    font-family: 'Cinzel', serif;
    color: var(--gold);
    font-size: 1rem;
    z-index: 200;
    box-shadow: 0 6px 24px rgba(0,0,0,0.7);
    text-align: center;
    max-width: 340px;
    width: 90%;
    animation: slideDown 0.3s ease;
  }
  .event-banner.show { display: block; }
  @keyframes slideDown {
    from { transform: translateX(-50%) translateY(-20px); opacity: 0; }
    to   { transform: translateX(-50%) translateY(0);    opacity: 1; }
  }
  .ev-icon { font-size: 2rem; display: block; margin-bottom: 4px; }
  .ev-title { font-weight: 700; font-size: 1rem; margin-bottom: 4px; }
  .ev-desc { font-family: 'Crimson Text', serif; font-size: 0.9rem; color: var(--parchment); }

  /* Win/Lose overlay */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .overlay.show { display: flex; }
  .overlay-box {
    background: linear-gradient(160deg, var(--parchment), var(--parchment-dark));
    border: 4px solid var(--dark-gold);
    border-radius: 16px;
    padding: 30px 24px;
    text-align: center;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 8px 40px rgba(0,0,0,0.7);
  }
  .overlay-icon { font-size: 4rem; margin-bottom: 10px; }
  .overlay-title {
    font-family: 'Cinzel', serif;
    font-size: 1.8rem;
    font-weight: 900;
    color: var(--brown);
    margin-bottom: 8px;
  }
  .overlay-msg { font-size: 1rem; color: var(--brown-light); margin-bottom: 20px; line-height: 1.5; }
  .btn-restart {
    background: linear-gradient(135deg, var(--dark-gold), #e0a020);
    border: none;
    border-radius: 10px;
    padding: 12px 30px;
    font-family: 'Cinzel', serif;
    font-size: 1rem;
    font-weight: 700;
    color: var(--brown);
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 3px 10px rgba(0,0,0,0.3);
  }
  .btn-restart:hover { transform: scale(1.05); filter: brightness(1.1); }

  /* Tooltip */
  .tooltip { position: relative; }
  .tooltip:hover::after {
    content: attr(data-tip);
    position: absolute;
    bottom: 110%;
    left: 50%;
    transform: translateX(-50%);
    background: #1a0a00;
    color: var(--gold);
    font-size: 0.7rem;
    padding: 4px 8px;
    border-radius: 6px;
    white-space: nowrap;
    border: 1px solid var(--dark-gold);
    z-index: 10;
    pointer-events: none;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 3px; }
  ::-webkit-scrollbar-thumb { background: var(--dark-gold); border-radius: 3px; }

  /* Name Input */
  .name-input-wrap {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .name-input {
    flex: 1;
    min-width: 160px;
    padding: 8px 14px;
    border: 2px solid var(--dark-gold);
    border-radius: 8px;
    background: rgba(255,255,255,0.85);
    font-family: 'Cinzel', serif;
    font-size: 0.95rem;
    color: var(--brown);
    outline: none;
  }
  .name-input:focus { border-color: var(--gold); box-shadow: 0 0 8px rgba(245,200,66,0.4); }
  .btn-save-score {
    background: linear-gradient(135deg, var(--dark-gold), #e0a020);
    border: none;
    border-radius: 8px;
    padding: 8px 18px;
    font-family: 'Cinzel', serif;
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--brown);
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .btn-save-score:hover { transform: scale(1.05); filter: brightness(1.1); }
  .btn-save-score:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* Highscore Table */
  .hs-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }
  .hs-table th {
    font-family: 'Cinzel', serif;
    font-size: 0.75rem;
    color: var(--brown-light);
    text-align: left;
    padding: 4px 8px;
    border-bottom: 1px solid var(--dark-gold);
  }
  .hs-table td {
    padding: 6px 8px;
    border-bottom: 1px solid rgba(184,134,11,0.2);
    color: var(--brown);
  }
  .hs-table tr.hs-top td { font-weight: 700; color: var(--brown); }
  .hs-table tr.hs-top:first-child td { color: #8b4500; }
  .hs-rank { font-family: 'Cinzel', serif; font-weight: 700; width: 30px; }
  .hs-gold-val { font-family: 'Cinzel', serif; font-weight: 700; color: var(--dark-gold); }
  .hs-empty { text-align: center; font-style: italic; color: var(--brown-light); padding: 16px; }
  .hs-new { background: rgba(245,200,66,0.2); animation: hs-flash 1s ease; }
  @keyframes hs-flash {
    0%   { background: rgba(245,200,66,0.5); }
    100% { background: rgba(245,200,66,0.15); }
  }
  .btn-clear-hs {
    background: none;
    border: 1px solid rgba(139,26,26,0.4);
    border-radius: 6px;
    padding: 3px 10px;
    font-size: 0.7rem;
    color: var(--red);
    cursor: pointer;
    font-family: 'Crimson Text', serif;
    margin-left: auto;
    transition: all 0.15s;
  }
  .btn-clear-hs:hover { background: rgba(139,26,26,0.1); }

  .btn-bag-upgrade {
    background: linear-gradient(135deg, #1a5c1a, #2a8c2a);
    border: 1px solid #3aac3a;
    border-radius: 6px;
    padding: 3px 10px;
    font-size: 0.72rem;
    color: #d4f0d4;
    cursor: pointer;
    font-family: 'Cinzel', serif;
    margin-left: 8px;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn-bag-upgrade:hover:not(:disabled) { filter: brightness(1.15); }
  .btn-bag-upgrade:disabled { opacity: 0.45; cursor: not-allowed; background: #444; border-color: #666; color: #999; }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <button class="music-btn" id="musicBtn" onclick="toggleMusic()" title="Musik an">🔇</button>
    <h1>🐉 Drachenhandel</h1>
    <div class="subtitle">Reise durch die magischen Lande — kaufe günstig, verkaufe teuer!</div>
  </div>

  <div class="status-bar" id="statusBar"></div>

  <div class="panel">
    <div class="panel-title">🗺️ Karte der Zauberlande <span style="font-size:0.8rem; font-weight:400; color:var(--brown-light); margin-left:auto;">Runden übrig:</span></div>
    <div class="turns-left" id="turnsLeft"></div>
    <div style="height:10px"></div>
    <div class="city-map" id="cityMap"></div>
  </div>

  <div class="panel">
    <div class="panel-title" id="marketTitle">🏪 Markt</div>
    <div class="goods-grid" id="marketGoods"></div>
  </div>

  <div class="panel">
    <div class="panel-title">🎒 Dein Rucksack
      <span id="bagCount" style="font-size:0.8rem; font-weight:400; color:var(--brown-light); margin-left:auto;"></span>
      <button id="bagUpgradeBtn" onclick="upgradeBag()" class="btn-bag-upgrade">+1 Platz · 50 🪙</button>
    </div>
    <div class="bag-bar"><div class="bag-fill" id="bagFill"></div></div>
    <div style="height:8px"></div>
    <div class="inventory-grid" id="inventory"></div>
  </div>

  <div class="panel">
    <div class="panel-title">📜 Reisetagebuch</div>
    <div class="log" id="log"></div>
  </div>

  <div class="panel">
    <div class="panel-title">🏆 Bestenliste <button class="btn-clear-hs" onclick="clearHighscores()">🗑️ Löschen</button></div>
    <div id="highscoreList"></div>
  </div>
</div>

<!-- Event flash banner -->
<div class="event-banner" id="eventBanner">
  <span class="ev-icon" id="evIcon"></span>
  <div class="ev-title" id="evTitle"></div>
  <div class="ev-desc" id="evDesc"></div>
</div>

<!-- Win/Lose overlay -->
<div class="overlay" id="overlay">
  <div class="overlay-box">
    <div class="overlay-icon" id="overlayIcon"></div>
    <div class="overlay-title" id="overlayTitle"></div>
    <div class="overlay-msg" id="overlayMsg"></div>
    <div class="name-input-wrap">
      <input class="name-input" id="playerNameInput" type="text" maxlength="20" placeholder="Dein Name..." />
      <button class="btn-save-score" id="btnSaveScore" onclick="saveScore()">💾 Eintragen</button>
    </div>
    <button class="btn-restart" onclick="initGame()">🔄 Nochmal spielen!</button>
  </div>
</div>

<script>
// ---- GAME DATA ----
const CITIES = [
  { id: 'drachenfels', name: 'Drachenfels', icon: '🏔️', tag: 'Drachenhort',   special: 'drachenstaub',   travelCost: 0  },
  { id: 'elfenwald',   name: 'Elfenwald',   icon: '🌲', tag: 'Elfensiedlung', special: 'elfenpulver',    travelCost: 10 },
  { id: 'kristallsee', name: 'Kristallsee', icon: '💧', tag: 'Wasserreich',   special: 'zauberkristall', travelCost: 15 },
  { id: 'feuerberg',   name: 'Feuerberg',   icon: '🌋', tag: 'Zwergenstadt',  special: 'feuergold',      travelCost: 20 },
  { id: 'mondturm',    name: 'Mondturm',    icon: '🌙', tag: 'Zauberburg',    special: 'mondstein',      travelCost: 25 },
  { id: 'sturmklippe', name: 'Sturmklippe', icon: '⚡', tag: 'Hexendorf',     special: 'blitzkraut',     travelCost: 30 },
];

const GOODS = [
  { id: 'drachenstaub',   name: 'Drachenstaub',   icon: '✨', basePrice: 30 },
  { id: 'elfenpulver',    name: 'Elfenpulver',     icon: '🌟', basePrice: 40 },
  { id: 'zauberkristall', name: 'Zauberkristall',  icon: '💎', basePrice: 55 },
  { id: 'feuergold',      name: 'Feuergold',       icon: '🔥', basePrice: 70 },
  { id: 'mondstein',      name: 'Mondstein',       icon: '🌕', basePrice: 60 },
  { id: 'blitzkraut',     name: 'Blitzkraut',      icon: '⚡', basePrice: 35 },
  { id: 'heiltrank',      name: 'Heiltrank',       icon: '🧪', basePrice: 45 },
  { id: 'drachenschuppe', name: 'Drachenschuppe',  icon: '🛡️', basePrice: 80 },
];

// Random travel events (30% chance per journey)
const EVENTS = [
  {
    id: 'banditen', icon: '⚔️', title: 'Räuberüberfall!', prob: 0.20,
    apply(s) {
      if (s.bag.length > 0 && Math.random() < 0.45) {
        const stolen = s.bag.splice(Math.floor(Math.random() * s.bag.length), 1)[0];
        return { msg: `⚔️ Räuber stehlen dir ${stolen.icon} ${stolen.name}!`, type: 'bad', desc: `${stolen.icon} ${stolen.name} gestohlen!` };
      }
      const loss = Math.min(s.gold, 10 + Math.floor(Math.random() * 25));
      s.gold -= loss;
      return { msg: `⚔️ Räuber überfallen dich! ${loss} 🪙 geraubt!`, type: 'bad', desc: `${loss} 🪙 geraubt!` };
    }
  },
  {
    id: 'gluecksfund', icon: '✨', title: 'Glücksfund!', prob: 0.16,
    apply(s) {
      if (!bagFull() && Math.random() < 0.5) {
        const good = GOODS[Math.floor(Math.random() * GOODS.length)];
        s.bag.push({ id: good.id, name: good.name, icon: good.icon, buyPrice: 0 });
        return { msg: `✨ Du findest ${good.icon} ${good.name} am Wegesrand!`, type: 'good', desc: `${good.icon} ${good.name} gefunden!` };
      }
      const bonus = 15 + Math.floor(Math.random() * 25);
      s.gold += bonus;
      return { msg: `✨ Versteckter Geldbeutel — ${bonus} 🪙!`, type: 'good', desc: `${bonus} 🪙 gefunden!` };
    }
  },
  {
    id: 'wanderhaendler', icon: '🧙', title: 'Wanderhändler!', prob: 0.12,
    apply(s) {
      const bonus = 20 + Math.floor(Math.random() * 30);
      s.gold += bonus;
      return { msg: `🧙 Ein Wanderhändler zahlt dir ${bonus} 🪙 für alte Waren!`, type: 'good', desc: `${bonus} 🪙 extra!` };
    }
  },
  {
    id: 'sturm', icon: '🌩️', title: 'Gewitter!', prob: 0.10,
    apply(s) {
      if (s.turnsLeft <= 2) return null;
      s.turnsLeft--;
      return { msg: `🌩️ Ein Sturm verzögert die Reise — eine Runde verloren!`, type: 'bad', desc: '−1 Runde' };
    }
  },
  {
    id: 'stadtfest', icon: '🎉', title: 'Stadtfest!', prob: 0.12,
    apply(s) {
      const bonus = 15 + Math.floor(Math.random() * 20);
      s.gold += bonus;
      return { msg: `🎉 Ein Stadtfest! Großzügige Händler geben dir ${bonus} 🪙!`, type: 'good', desc: `${bonus} 🪙 Festbonus!` };
    }
  },
  {
    id: 'drache', icon: '🐉', title: 'Drachenbegegnung!', prob: 0.07,
    apply(s) {
      if (!bagFull()) {
        const g = GOODS.find(x => x.id === 'drachenstaub');
        s.bag.push({ id: g.id, name: g.name, icon: g.icon, buyPrice: 0 });
        return { msg: `🐉 Ein Drache hinterlässt ✨ Drachenstaub für dich!`, type: 'good', desc: '✨ Drachenstaub erhalten!' };
      }
      s.gold += 30;
      return { msg: `🐉 Ein beeindruckter Drache belohnt dich mit 30 🪙!`, type: 'good', desc: '30 🪙 Drachenbonus!' };
    }
  },
];

const BAG_MAX = 6;
const BAG_START = 3;
const CARRY_PER_ITEM = 5;
const START_GOLD = 200;
const TOTAL_TURNS = 12;
const WIN_GOLD = 500;

// ---- STATE ----
let state = {};
let bannerTimer = null;

function initGame() {
  document.getElementById('overlay').classList.remove('show');
  const cityPrices = {};
  const cityRep = {};
  CITIES.forEach(city => {
    cityPrices[city.id] = {};
    cityRep[city.id] = 0;
    GOODS.forEach(good => {
      const isSpecial = city.special === good.id;
      const f = isSpecial ? 0.55 + Math.random() * 0.2 : 1.0 + Math.random() * 0.6;
      cityPrices[city.id][good.id] = Math.round(good.basePrice * f);
    });
  });
  state = {
    gold: START_GOLD,
    turnsLeft: TOTAL_TURNS,
    currentCity: 'drachenfels',
    bag: [],
    bagMaxSize: BAG_START,
    cityPrices,
    cityRep,
    log: [
      { msg: '🐉 Willkommen, tapferer Händler! Reise durch die Zauberlande und mache Gewinn!', type: '' },
      { msg: '💡 Tipp: Spezialware (⭐) ist in ihrer Heimatstadt günstig — anderswo teuer!', type: '' },
      { msg: '🎒 Tipp: Gepäck kostet extra — jedes Item +5 🪙 Reisekosten! Rucksack für 50 🪙 erweitern.', type: '' },
    ],
  };
  render();
}

// ---- HELPERS ----
function bagCount() { return state.bag.length; }
function bagFull()  { return state.bag.length >= state.bagMaxSize; }

function effectiveTravelCost(cityId) {
  const city = CITIES.find(c => c.id === cityId);
  return (city ? city.travelCost : 0) + bagCount() * CARRY_PER_ITEM;
}

function upgradeBag() {
  if (state.bagMaxSize >= BAG_MAX) return;
  if (state.gold < 50) { addLog('💸 Nicht genug Gold für Rucksackerweiterung (50 🪙)!', 'bad'); render(); return; }
  state.gold -= 50;
  state.bagMaxSize++;
  addLog(`🎒 Rucksack erweitert! Jetzt ${state.bagMaxSize} Plätze. (noch ${BAG_MAX - state.bagMaxSize} Erweiterung${BAG_MAX - state.bagMaxSize === 1 ? '' : 'en'} möglich)`, 'good');
  render();
}

// Reputation discount: each ⭐ = 3% better price
function getBuyPrice(cityId, goodId) {
  const base = state.cityPrices[cityId][goodId];
  const rep  = state.cityRep[cityId] || 0;
  return Math.max(5, Math.round(base * (1 - rep * 0.03)));
}
function getSellPrice(cityId, goodId) {
  const base = state.cityPrices[cityId][goodId];
  const rep  = state.cityRep[cityId] || 0;
  return Math.round(base * (1 + rep * 0.03));
}

function addLog(msg, type = '') {
  state.log.unshift({ msg, type });
  if (state.log.length > 40) state.log.pop();
}

function showBanner(icon, title, desc) {
  document.getElementById('evIcon').textContent  = icon;
  document.getElementById('evTitle').textContent = title;
  document.getElementById('evDesc').textContent  = desc;
  const b = document.getElementById('eventBanner');
  b.classList.add('show');
  if (bannerTimer) clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => b.classList.remove('show'), 2800);
}

function triggerEvent() {
  for (const evt of EVENTS) {
    if (Math.random() < evt.prob) {
      const r = evt.apply(state);
      if (r) { addLog(r.msg, r.type); showBanner(evt.icon, evt.title, r.desc); return; }
    }
  }
}

function travel(cityId) {
  const city = CITIES.find(c => c.id === cityId);
  if (!city || cityId === state.currentCity) return;
  const cost = effectiveTravelCost(cityId);
  if (cost > state.gold) {
    addLog(`⚠️ Nicht genug Gold für die Reise nach ${city.name}! (${city.travelCost} + ${bagCount()}×${CARRY_PER_ITEM} = ${cost} 🪙)`, 'bad');
    render(); return;
  }
  state.gold -= cost;
  state.currentCity = cityId;
  state.turnsLeft--;

  // Gain reputation in destination (max 5)
  if (state.cityRep[cityId] < 5) state.cityRep[cityId]++;

  // Slight price fluctuation on visit
  GOODS.forEach(good => {
    const cur = state.cityPrices[cityId][good.id];
    state.cityPrices[cityId][good.id] = Math.max(5, cur + Math.floor((Math.random() - 0.5) * 12));
  });

  const bagCarry = bagCount() * CARRY_PER_ITEM;
  if (cost > 0) {
    if (bagCarry > 0) addLog(`🗺️ Reise nach ${city.name}: ${city.travelCost} 🪙 + ${bagCount()}×${CARRY_PER_ITEM} 🪙 Gepäck = ${cost} 🪙`, 'bad');
    else addLog(`🗺️ Reise nach ${city.name} kostet ${cost} 🪙`, 'bad');
  } else {
    addLog(`🏠 Du bist in ${city.name}.`);
  }

  const rep = state.cityRep[cityId];
  if (rep > 0) addLog(`🤝 Ruf in ${city.name}: ${'⭐'.repeat(rep)} (${rep * 3}% bessere Preise)`, 'good');

  // 30% chance of random event on any journey
  if (Math.random() < 0.30) triggerEvent();

  checkEnd();
  render();
}

function buy(goodId) {
  if (bagFull()) { addLog('🎒 Dein Rucksack ist voll!', 'bad'); render(); return; }
  const price = getBuyPrice(state.currentCity, goodId);
  if (price > state.gold) { addLog('💸 Nicht genug Gold!', 'bad'); render(); return; }
  const good = GOODS.find(g => g.id === goodId);
  state.gold -= price;
  state.bag.push({ id: goodId, name: good.name, icon: good.icon, buyPrice: price });
  addLog(`✅ ${good.icon} ${good.name} für ${price} 🪙 gekauft`, 'good');
  render();
}

function sell(goodId) {
  const idx = state.bag.findIndex(b => b.id === goodId);
  if (idx === -1) return;
  const item = state.bag.splice(idx, 1)[0];
  const price = getSellPrice(state.currentCity, goodId);
  const profit = price - item.buyPrice;
  state.gold += price;
  if (profit > 0)      addLog(`💰 ${item.icon} ${item.name} für ${price} 🪙 (+${profit} Gewinn!)`, 'good');
  else if (profit < 0) addLog(`📉 ${item.icon} ${item.name} für ${price} 🪙 (${profit} Verlust)`, 'bad');
  else                 addLog(`➡️ ${item.icon} ${item.name} für ${price} 🪙 (kein Gewinn)`, '');
  render();
}

function checkEnd() {
  if (state.turnsLeft <= 0) setTimeout(showEnd, 300);
}

// ---- HIGHSCORE ----
const HS_KEY = 'drachenhandel_hs';

function loadHighscores() {
  try { return JSON.parse(localStorage.getItem(HS_KEY) || '[]'); } catch { return []; }
}
function clearHighscores() {
  if (confirm('Wirklich alle Einträge löschen?')) { localStorage.removeItem(HS_KEY); renderHighscores(); }
}
function saveScore() {
  const nameEl = document.getElementById('playerNameInput');
  const name = nameEl.value.trim() || 'Unbekannter Held';
  const list = loadHighscores();
  list.push({ name, gold: state._finalGold, won: state._won, date: new Date().toLocaleDateString('de-DE') });
  list.sort((a, b) => b.gold - a.gold);
  list.length = Math.min(list.length, 10);
  localStorage.setItem(HS_KEY, JSON.stringify(list));
  document.getElementById('btnSaveScore').disabled = true;
  document.getElementById('btnSaveScore').textContent = '✅ Gespeichert!';
  nameEl.disabled = true;
  renderHighscores(name);
}

function renderHighscores(highlight) {
  const list = loadHighscores();
  const el = document.getElementById('highscoreList');
  if (!list.length) { el.innerHTML = '<div class="hs-empty">Noch keine Einträge — spiel und trag dich ein! 🐉</div>'; return; }
  const medals = ['🥇','🥈','🥉'];
  const rows = list.map((e, i) => {
    const isNew = highlight && e.name === highlight && i === list.findIndex(x => x.name === highlight && x.gold === e.gold);
    return `<tr class="${i < 3 ? 'hs-top' : ''} ${isNew ? 'hs-new' : ''}">
      <td class="hs-rank">${medals[i] || (i+1)+'.'}</td><td>${e.name}</td>
      <td class="hs-gold-val">${e.gold} 🪙</td><td>${e.won ? '🏆' : '😔'}</td>
      <td style="font-size:0.72rem;color:var(--brown-light)">${e.date}</td></tr>`;
  }).join('');
  el.innerHTML = `<table class="hs-table"><thead><tr><th>#</th><th>Name</th><th>Gold</th><th>Ergebnis</th><th>Datum</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function showEnd() {
  let finalGold = state.gold;
  state.bag.forEach(item => { finalGold += getSellPrice(state.currentCity, item.id); });
  state._finalGold = finalGold;
  state._won = finalGold >= WIN_GOLD;

  document.getElementById('playerNameInput').value = '';
  document.getElementById('playerNameInput').disabled = false;
  document.getElementById('btnSaveScore').disabled = false;
  document.getElementById('btnSaveScore').textContent = '💾 Eintragen';

  document.getElementById('overlayIcon').textContent  = state._won ? '🏆' : '😔';
  document.getElementById('overlayTitle').textContent = state._won ? 'Gewonnen!' : 'Schade!';
  document.getElementById('overlayMsg').innerHTML     = state._won
    ? `Du hast <strong>${finalGold} 🪙</strong> verdient!<br><br>Der König ernennt dich zum <em>Meister-Drachenhändler</em>! 🐉`
    : `Du hast <strong>${finalGold} 🪙</strong> verdient.<br>Ziel war: ${WIN_GOLD} 🪙 — knapp daneben!<br><br>Nächstes Mal schaffst du es! 💪`;
  document.getElementById('overlay').classList.add('show');
}

// ---- RENDER ----
function render() {
  // Status bar
  document.getElementById('statusBar').innerHTML = `
    <div class="stat-badge"><span class="icon">🪙</span><span>Gold:</span><span class="value">${state.gold}</span></div>
    <div class="stat-badge"><span class="icon">🎒</span><span>Rucksack:</span><span class="value">${bagCount()}/${state.bagMaxSize}</span></div>
    <div class="stat-badge"><span class="icon">⏳</span><span>Runden:</span><span class="value">${state.turnsLeft}</span></div>
    <div class="stat-badge"><span class="icon">🏆</span><span>Ziel:</span><span class="value">${WIN_GOLD} 🪙</span></div>`;

  // Turn dots
  const used = TOTAL_TURNS - state.turnsLeft;
  document.getElementById('turnsLeft').innerHTML =
    Array.from({length: TOTAL_TURNS}, (_, i) => `<div class="turn-dot ${i < used ? 'used' : ''}"></div>`).join('');

  // City map
  document.getElementById('cityMap').innerHTML = CITIES.map(city => {
    const isCurrent = city.id === state.currentCity;
    const effCost = isCurrent ? 0 : effectiveTravelCost(city.id);
    const canAfford = isCurrent || effCost <= state.gold;
    const rep = state.cityRep[city.id] || 0;
    const carry = bagCount() * CARRY_PER_ITEM;
    const tip = isCurrent ? 'Du bist hier!' : canAfford
      ? (carry > 0 ? `Basis ${city.travelCost} + ${bagCount()}×${CARRY_PER_ITEM} Gepäck` : 'Reise hierher')
      : 'Zu teuer!';
    const costLabel = isCurrent ? '📍 Hier' : (effCost === 0 ? 'Start' : `${effCost} 🪙`);
    return `<button class="city-btn ${isCurrent ? 'current' : ''} tooltip"
        data-tip="${tip}"
        onclick="travel('${city.id}')" ${isCurrent || !canAfford ? 'disabled' : ''}>
      <span class="city-icon">${city.icon}</span>
      <span class="city-name">${city.name}</span>
      <span class="city-tag">${city.tag}</span>
      <span class="travel-cost">${costLabel}</span>
      ${rep > 0 ? `<span class="city-rep">${'⭐'.repeat(rep)}</span>` : ''}
    </button>`;
  }).join('');

  // Market
  const city = CITIES.find(c => c.id === state.currentCity);
  document.getElementById('marketTitle').innerHTML = `🏪 Markt in ${city.icon} ${city.name}`;
  const inBag = {};
  state.bag.forEach(b => { inBag[b.id] = (inBag[b.id] || 0) + 1; });
  document.getElementById('marketGoods').innerHTML = GOODS.map(good => {
    const bp = getBuyPrice(state.currentCity, good.id);
    const sp = getSellPrice(state.currentCity, good.id);
    const owned = inBag[good.id] || 0;
    const isSpecial = city.special === good.id;
    return `<div class="good-card">
      <div class="good-header">
        <span class="good-icon">${good.icon}</span>
        <div>
          <div class="good-name">${good.name}${isSpecial ? ' ⭐' : ''}</div>
          <div class="good-price" ${isSpecial ? 'style="color:var(--green);font-weight:700"' : ''}>Kauf: ${bp} 🪙 &nbsp; Verk: ${sp} 🪙</div>
        </div>
      </div>
      <div class="good-actions">
        <button class="btn-trade btn-buy" onclick="buy('${good.id}')" ${bagFull() || bp > state.gold ? 'disabled' : ''}>Kaufen</button>
        <button class="btn-trade btn-sell" onclick="sell('${good.id}')" ${owned === 0 ? 'disabled' : ''}>Verkaufen</button>
      </div>
      ${owned > 0 ? `<div class="in-bag">Im Rucksack: ${owned}x</div>` : ''}
    </div>`;
  }).join('');

  // Inventory
  const pct = (bagCount() / state.bagMaxSize) * 100;
  const fill = document.getElementById('bagFill');
  fill.style.width = pct + '%';
  fill.className = 'bag-fill' + (bagFull() ? ' full' : '');
  document.getElementById('bagCount').textContent = `${bagCount()} / ${state.bagMaxSize} Plätze`;

  const upgradeBtn = document.getElementById('bagUpgradeBtn');
  if (state.bagMaxSize >= BAG_MAX) {
    upgradeBtn.textContent = '🎒 Voll ausgebaut';
    upgradeBtn.disabled = true;
  } else {
    upgradeBtn.textContent = `+1 Platz · 50 🪙`;
    upgradeBtn.disabled = state.gold < 50;
  }

  if (bagCount() === 0) {
    document.getElementById('inventory').innerHTML = '<div class="inv-empty">Noch nichts gekauft...</div>';
  } else {
    const grouped = {};
    state.bag.forEach(item => {
      if (!grouped[item.id]) grouped[item.id] = { ...item, count: 0, totalBuy: 0 };
      grouped[item.id].count++;
      grouped[item.id].totalBuy += item.buyPrice;
    });
    document.getElementById('inventory').innerHTML = Object.values(grouped).map(g => {
      const sp = getSellPrice(state.currentCity, g.id);
      const avg = g.count > 0 ? Math.round(g.totalBuy / g.count) : 0;
      const diff = sp - avg;
      const col = diff > 0 ? 'var(--green)' : diff < 0 ? 'var(--red)' : 'inherit';
      return `<div class="inv-item">
        <div class="inv-icon">${g.icon}</div>
        <div>${g.name}</div>
        <div style="font-weight:600">${g.count}x</div>
        <div style="font-size:.65rem;color:${col}">${diff >= 0 ? '+' : ''}${diff} 🪙</div>
      </div>`;
    }).join('');
  }

  // Log
  document.getElementById('log').innerHTML = state.log
    .map(e => `<div class="log-entry ${typeof e === 'object' ? e.type : ''}">${typeof e === 'object' ? e.msg : e}</div>`)
    .join('');

  renderHighscores();
}

// ---- MUSIC (Web Audio API — pentatonic medieval arpeggio) ----
let audioCtx = null;
let musicPlaying = false;
let musicTimer = null;
let masterGain, delayIn;

// D minor pentatonic: D3 F3 G3 A3 C4 D4 F4 A4
const SCALE = [146.83, 174.61, 196.00, 220.00, 261.63, 293.66, 349.23, 440.00];
const PATTERNS = [
  [4,2,3,5,4,3,2,0],   // descending feel
  [0,2,4,5,3,4,2,1],   // ascending feel
  [4,5,3,2,4,2,0,1],   // mixed
];
const BEAT = 0.46; // seconds per note

function setupAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.32;
  masterGain.connect(audioCtx.destination);

  // Short echo
  const delay = audioCtx.createDelay(0.6);
  delay.delayTime.value = 0.24;
  const fb = audioCtx.createGain(); fb.gain.value = 0.25;
  const dOut = audioCtx.createGain(); dOut.gain.value = 0.28;
  delay.connect(fb); fb.connect(delay);
  delay.connect(dOut); dOut.connect(masterGain);
  delayIn = delay;
}

function playTone(freq, t, dur, vol, type = 'triangle') {
  const osc = audioCtx.createOscillator();
  const g   = audioCtx.createGain();
  osc.type = type; osc.frequency.value = freq;
  g.gain.setValueAtTime(0.001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.04);
  g.gain.setValueAtTime(vol * 0.65, t + dur * 0.55);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(g); g.connect(masterGain); g.connect(delayIn);
  osc.start(t); osc.stop(t + dur + 0.04);
}

function scheduleMusic() {
  if (!musicPlaying) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();

  const now = audioCtx.currentTime;
  const pat = PATTERNS[Math.floor(Math.random() * PATTERNS.length)];

  pat.forEach((idx, i) => {
    playTone(SCALE[idx],       now + i * BEAT, BEAT * 1.25, 0.07);
    // Occasional octave-up harmony on beat 1 and 5
    if ((i === 0 || i === 4) && idx + 1 < SCALE.length)
      playTone(SCALE[idx + 1], now + i * BEAT, BEAT * 0.9, 0.025);
  });

  // Bass drone every 2 beats
  for (let i = 0; i < 4; i++)
    playTone(73.42, now + i * BEAT * 2, BEAT * 1.7, 0.045, 'sine');

  musicTimer = setTimeout(scheduleMusic, (pat.length * BEAT - 0.06) * 1000);
}

function toggleMusic() {
  setupAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  musicPlaying = !musicPlaying;
  const btn = document.getElementById('musicBtn');
  if (musicPlaying) {
    scheduleMusic();
    btn.textContent = '🎵';
    btn.title = 'Musik aus';
  } else {
    clearTimeout(musicTimer);
    btn.textContent = '🔇';
    btn.title = 'Musik an';
  }
}

// Start!
initGame();
</script>
