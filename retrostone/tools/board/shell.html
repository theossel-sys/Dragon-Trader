<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RetroStone Board">
<title>RetroStone Board</title>
<style>
  html, body { margin: 0; height: 100%; background: #1d4d33; overflow: hidden; touch-action: none;
               -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
  #stage { position: fixed; top: env(safe-area-inset-top); right: env(safe-area-inset-right);
           bottom: env(safe-area-inset-bottom); left: env(safe-area-inset-left); }
  canvas { display: block; width: 100% !important; height: 100% !important; outline: none; }
  #start { position: fixed; inset: 0; z-index: 4; display: flex; flex-direction: column; align-items: center;
           justify-content: center; background: #1d4d33; color: #f4ecd8; font: 600 20px system-ui; text-align: center; gap: 12px; }
  #start small { font-weight: 400; font-size: 14px; opacity: .8; max-width: 80vw; }
  #bar { width: 60vw; max-width: 320px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.2); overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: #ffd34d; transition: width .2s; }
</style>
</head>
<body>
<div id="stage"><canvas id="canvas" tabindex="-1"></canvas></div>
<div id="start"><div id="msg">Lädt …</div><div id="bar"><i></i></div><small>Brettspiele, Kartenspiele und Rätsel. Gegen den Computer oder zu zweit an einem Gerät.</small></div>
<script>
  function unlockAudio() {
    try { if (Module.SDL2 && Module.SDL2.audioContext && Module.SDL2.audioContext.state !== 'running') Module.SDL2.audioContext.resume(); } catch (e) {}
  }
  ['touchstart', 'touchend', 'mousedown', 'keydown'].forEach(function (t) { document.addEventListener(t, unlockAudio, true); });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  // the settings and progress (SDL_GetPrefPath: /libsdl/...) in IndexedDB
  var syncing = false;
  function saveSync() {
    if (syncing || !Module.FS) return; syncing = true;
    Module.FS.syncfs(false, function () { syncing = false; });
  }
  setInterval(saveSync, 4000);
  document.addEventListener('visibilitychange', function () { if (document.hidden) saveSync(); });
  window.addEventListener('pagehide', saveSync);
  var Module = {
    canvas: document.getElementById('canvas'),
    print: function (t) { console.log(t); }, printErr: function (t) { console.warn(t); },
    setStatus: function (t) {
      var m = t && t.match(/\((\d+(\.\d+)?)\/(\d+)\)/);
      if (m) document.querySelector('#bar i').style.width = (100 * m[1] / m[3]) + '%';
    },
    preRun: [function () {
      Module.FS.mkdir('/libsdl'); Module.FS.mount(Module.IDBFS, {}, '/libsdl');
      Module.addRunDependency('idbfs');
      Module.FS.syncfs(true, function () { Module.removeRunDependency('idbfs'); });
    }],
    onRuntimeInitialized: function () {
      var s = document.getElementById('start');
      setTimeout(function () { s.style.display = 'none'; }, 200);
    },
  };
</script>
{{{ SCRIPT }}}
</body>
</html>
